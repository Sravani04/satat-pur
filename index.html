<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SATAT PUR - Mobile 3D Studio | ISWK Class 1 A</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif'],
                        inter: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #030712;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .phone-frame {
            width: 100vw;
            height: 100vh;
            max-width: 430px;
            max-height: 900px;
            background-color: #090d16;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 480px) {
            .phone-frame {
                border: 12px solid #1e293b;
                border-radius: 48px;
                height: 88vh;
            }
        }

        #webgl-canvas {
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .custom-scrollbar::-webkit-scrollbar {
            height: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.3);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #10b981;
            border-radius: 4px;
        }

        .pulse-glow {
            animation: pulse-glow-anim 1.2s ease-out;
        }

        @keyframes pulse-glow-anim {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body>

    <!-- Smartphone Wrapper -->
    <div class="phone-frame" id="phoneContainer">

        <!-- Initial Start Audio Banner Overlay -->
        <div id="startAudioOverlay" onclick="startIntroSpeech()" class="absolute inset-0 z-30 bg-slate-950/80 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center cursor-pointer transition-all">
            <div class="w-16 h-16 bg-emerald-600 rounded-full flex items-center justify-center text-white text-2xl mb-4 shadow-xl animate-bounce">
                <i class="fa-solid fa-volume-high"></i>
            </div>
            <h3 class="text-base font-bold text-white mb-1">Tap Anywhere to Start</h3>
            <p class="text-xs text-slate-300 max-w-[260px]">Listen to the Indian English audio introduction by Class 1 A Eco-Kids</p>
        </div>

        <!-- 3D WebGL Canvas -->
        <div id="webgl-canvas"></div>

        <!-- Top Mobile Header -->
        <header class="absolute top-3 left-3 right-3 z-20 flex justify-between items-center pointer-events-none gap-2">
            <div class="glass-card px-3.5 py-2 rounded-2xl pointer-events-auto flex items-center space-x-2.5 shadow-lg border-l-4 border-emerald-500">
                <div class="bg-gradient-to-br from-emerald-500 to-green-700 text-white p-2 rounded-xl shadow text-center">
                    <i class="fa-solid fa-city text-sm"></i>
                </div>
                <div>
                    <h1 class="font-bold text-xs tracking-tight text-white leading-tight">SATAT PUR</h1>
                    <p class="text-[10px] text-amber-400 font-semibold">ISWK Class 1 A</p>
                </div>
            </div>

            <div class="glass-card px-2.5 py-1.5 rounded-2xl pointer-events-auto flex items-center space-x-2 shadow-lg">
                <button onclick="toggleDayNight()" id="dayNightBtn" class="w-8 h-8 rounded-xl bg-slate-800 hover:bg-slate-700 text-amber-300 text-xs flex items-center justify-center transition border border-slate-700">
                    <i class="fa-solid fa-sun" id="dayNightIcon"></i>
                </button>
                <button onclick="toggleAudioSpeech()" id="audioBtn" class="w-8 h-8 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs flex items-center justify-center transition">
                    <i class="fa-solid fa-volume-high" id="audioIcon"></i>
                </button>
            </div>
        </header>

        <!-- Floating Bottom Control Panel -->
        <div class="absolute bottom-3 left-3 right-3 z-20 flex flex-col pointer-events-auto gap-2">
            
            <!-- Quick Feature Buttons -->
            <div class="glass-card p-2 rounded-2xl flex items-center gap-1.5 shadow-2xl overflow-x-auto custom-scrollbar">
                <button onclick="selectHotspot('maglev')" class="flex-shrink-0 px-2.5 py-1.5 rounded-xl bg-slate-800/95 hover:bg-emerald-900 border border-slate-700 text-[10px] font-medium text-white flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-train text-amber-400"></i> Maglev
                </button>
                <button onclick="selectHotspot('verticalgarden')" class="flex-shrink-0 px-2.5 py-1.5 rounded-xl bg-slate-800/95 hover:bg-emerald-900 border border-slate-700 text-[10px] font-medium text-white flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-seedling text-pink-400"></i> Garden & Flowers
                </button>
                <button onclick="selectHotspot('trees')" class="flex-shrink-0 px-2.5 py-1.5 rounded-xl bg-slate-800/95 hover:bg-emerald-900 border border-slate-700 text-[10px] font-medium text-white flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-tree text-emerald-400"></i> Green Canopy
                </button>
                <button onclick="selectHotspot('solar')" class="flex-shrink-0 px-2.5 py-1.5 rounded-xl bg-slate-800/95 hover:bg-emerald-900 border border-slate-700 text-[10px] font-medium text-white flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-solar-panel text-yellow-400"></i> Solar Panels
                </button>
                <button onclick="selectHotspot('ebus')" class="flex-shrink-0 px-2.5 py-1.5 rounded-xl bg-slate-800/95 hover:bg-emerald-900 border border-slate-700 text-[10px] font-medium text-white flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-bus-simple text-green-400"></i> E-Bus
                </button>
                <button onclick="selectHotspot('evcars')" class="flex-shrink-0 px-2.5 py-1.5 rounded-xl bg-slate-800/95 hover:bg-emerald-900 border border-slate-700 text-[10px] font-medium text-white flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-car-side text-red-400"></i> EV Cars
                </button>
                <button onclick="selectHotspot('wind')" class="flex-shrink-0 px-2.5 py-1.5 rounded-xl bg-slate-800/95 hover:bg-emerald-900 border border-slate-700 text-[10px] font-medium text-white flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-wind text-sky-400"></i> Windmills
                </button>
                <button onclick="selectHotspot('lake')" class="flex-shrink-0 px-2.5 py-1.5 rounded-xl bg-slate-800/95 hover:bg-emerald-900 border border-slate-700 text-[10px] font-medium text-white flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-water text-cyan-400"></i> Lake
                </button>
            </div>

            <!-- Active Inspector Card -->
            <div id="inspectorCard" class="glass-card p-3.5 rounded-2xl border border-emerald-500/40 shadow-2xl relative">
                <div class="flex items-center justify-between border-b border-slate-800 pb-1.5 mb-1.5">
                    <span id="inspectBadge" class="text-[9px] font-bold uppercase px-2 py-0.5 bg-emerald-500/20 text-emerald-300 rounded border border-emerald-500/30">Select Element</span>
                    <button onclick="resetInspectView()" class="text-[10px] text-slate-400 hover:text-white"><i class="fa-solid fa-rotate-right mr-1"></i>Reset</button>
                </div>
                <h4 id="inspectTitle" class="text-xs font-bold text-white mb-0.5">Tap any object in 3D scene</h4>
                <p id="inspectDesc" class="text-[11px] text-slate-300 leading-snug font-inter">
                    Project team: Nour, Avyukth, Brahmani, and Syed Affan. Tap any model element or use the buttons above to hear descriptions.
                </p>
            </div>

        </div>

    </div>

    <!-- 3D Engine Script -->
    <script>
        let scene, camera, renderer, controls;
        let trainMesh, eBusMesh, fountainParticles = [], turbineBlades = [];
        let clickableObjects = [];
        let dayNightState = true;
        let synth = window.speechSynthesis;
        let hasIntroPlayed = false;

        const hotspotData = {
            maglev: {
                title: "Elevated Bullet Maglev Train",
                badge: "Zero-Emission Rail",
                desc: "Aerodynamic high-speed bullet train gliding smoothly on elevated green pillars above the road loop using magnetic levitation for zero-pollution public transit.",
                speech: "This is the elevated Maglev bullet train. It glides smoothly on green support pillars above the road loop using magnetic levitation for zero-pollution public transit."
            },
            verticalgarden: {
                title: "Vertical Garden & Floral Wall",
                badge: "Urban Greening",
                desc: "Lush vertical planter wall embedded with vibrant colorful blooming flowers and foliage that purify air, dampen urban noise, and cool building facades.",
                speech: "This is the vertical garden wall. It features vibrant colorful blooming flowers and lush greenery that purify city air and reduce urban heat."
            },
            trees: {
                title: "Lush Green Urban Canopy",
                badge: "Eco Forest Grid",
                desc: "Dense pine and broadleaf shade trees planted along streets, lakefronts, and plazas to absorb carbon emissions and provide fresh oxygen.",
                speech: "These are green canopy trees scattered across the landscape. They capture carbon dioxide, provide shade, and create a healthy ecosystem."
            },
            solar: {
                title: "Rooftop Photovoltaic Solar Panels",
                badge: "Clean Energy",
                desc: "High-efficiency rooftop solar arrays harvesting abundant solar radiation to supply clean power to streetlights, EV chargers, and buildings.",
                speech: "These are rooftop solar panels. They harvest sunlight to generate clean electricity for the entire city."
            },
            ebus: {
                title: "Zero-Emission Electric Bus",
                badge: "Eco Public Transport",
                desc: "Powered entirely by battery packs with dynamic induction charging stops along the route, driving continuously around the city loop.",
                speech: "This is the moving zero-emission electric bus. It runs quietly on solar battery power along the city road loop to reduce air pollution."
            },
            evcars: {
                title: "Electric Sports Cars & Solar Charging Hub",
                badge: "Clean Mobility",
                desc: "Aerodynamic electric sports cars linked to fast-charging solar ports, promoting eco-friendly private transit without tailpipe exhaust.",
                speech: "These are sleek electric sports cars parked near rapid solar charging stations, producing zero emissions to keep our city air clean."
            },
            wind: {
                title: "Eco Wind Turbines",
                badge: "Renewable Power",
                desc: "Converts natural wind breeze into clean electricity, complementing the solar grid for uninterrupted sustainable energy.",
                speech: "These are eco wind turbines. They convert natural breeze into clean electricity for continuous sustainable power."
            },
            lake: {
                title: "Central Clean Lake & Fountain",
                badge: "Water Conservation",
                desc: "Central rainwater catchment basin featuring an aerating fountain that maintains water quality and cools the urban environment.",
                speech: "This is the central clean lake. It features a rainwater fountain that maintains water quality and keeps the environment cool."
            }
        };

        function getIndianVoice() {
            if (!synth) return null;
            const voices = synth.getVoices();
            return voices.find(v => v.lang === 'en-IN' || v.lang.includes('en_IN') || v.name.includes('India') || v.name.includes('Hindi')) ||
                   voices.find(v => v.lang.startsWith('en')) || null;
        }

        function speakText(text) {
            if (!synth) return;
            if (synth.speaking) synth.cancel();

            const utterThis = new SpeechSynthesisUtterance(text);
            utterThis.lang = 'en-IN';
            utterThis.rate = 0.95;

            const inVoice = getIndianVoice();
            if (inVoice) utterThis.voice = inVoice;

            synth.speak(utterThis);
        }

        function startIntroSpeech() {
            const overlay = document.getElementById('startAudioOverlay');
            if (overlay) overlay.style.display = 'none';

            if (!hasIntroPlayed) {
                hasIntroPlayed = true;
                speakText("Welcome to Satat Pur, a smart and sustainable Indian city created by Class 1 A students Nour, Avyukth, Brahmani, and Syed Affan from Indian School Al Wadi Al Kabir.");
            }
        }

        function initScene() {
            const container = document.getElementById('webgl-canvas');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0e1726);
            scene.fog = new THREE.FogExp2(0x0e1726, 0.012);

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 24, 34);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.02;
            controls.minDistance = 10;
            controls.maxDistance = 50;

            setupLighting();
            buildBaseModel();

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('click', onCanvasClick);

            if (synth && synth.onvoiceschanged !== undefined) {
                synth.onvoiceschanged = () => getIndianVoice();
            }

            animate();
        }

        let ambientLight, dirLight;

        function setupLighting() {
            ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            dirLight = new THREE.DirectionalLight(0xfff8e7, 1.25);
            dirLight.position.set(20, 35, 15);
            dirLight.castShadow = true;
            scene.add(dirLight);
        }

        function buildBaseModel() {
            // Main landscape base
            const baseMesh = new THREE.Mesh(
                new THREE.BoxGeometry(34, 1, 26),
                new THREE.MeshStandardMaterial({ color: 0x1b5e20, roughness: 0.6 })
            );
            baseMesh.position.y = -0.5;
            scene.add(baseMesh);

            // Backdrop Board
            const board = new THREE.Mesh(
                new THREE.BoxGeometry(34, 14, 0.8),
                new THREE.MeshStandardMaterial({ color: 0x0288d1, roughness: 0.4 })
            );
            board.position.set(0, 7, -12.5);
            scene.add(board);

            // Central Lake
            const lake = new THREE.Mesh(
                new THREE.CylinderGeometry(4.5, 4.5, 0.1, 32),
                new THREE.MeshStandardMaterial({ color: 0x00bcd4, roughness: 0.1, metalness: 0.8 })
            );
            lake.position.set(0, 0.06, 2);
            lake.userData = { key: 'lake' };
            scene.add(lake);
            clickableObjects.push(lake);

            createFountain(0, 0.1, 2);
            createCircularRoad(0, 2);
            createElevatedMaglevTrack(0, 2);
            createEcoBuildingsWithSolar();
            createVerticalGardenWithFlowers();
            createLandscapeTrees();
            createWindmills();
            createElectricBus();
            createElectricSportsCars();
            createSmartInfrastructure();
        }

        function createFountain(x, y, z) {
            const count = 35;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            for (let i = 0; i < count; i++) {
                positions[i * 3] = x + (Math.random() - 0.5) * 0.4;
                positions[i * 3 + 1] = y + 1 + Math.random() * 1.6;
                positions[i * 3 + 2] = z + (Math.random() - 0.5) * 0.4;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const pSystem = new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xe0f7fa, size: 0.28, transparent: true, opacity: 0.85 }));
            scene.add(pSystem);
            fountainParticles.push(pSystem);
        }

        function createCircularRoad(cx, cz) {
            const road = new THREE.Mesh(
                new THREE.RingGeometry(6.2, 9.2, 48),
                new THREE.MeshStandardMaterial({ color: 0x262626, side: THREE.DoubleSide })
            );
            road.rotation.x = -Math.PI / 2;
            road.position.set(cx, 0.02, cz);
            scene.add(road);
        }

        function createElevatedMaglevTrack(cx, cz) {
            const curve = new THREE.EllipseCurve(cx, cz, 11, 11, 0, 2 * Math.PI, false, 0);
            const points3D = curve.getPoints(64).map(p => new THREE.Vector3(p.x, 3.5, p.y));
            const path = new THREE.CatmullRomCurve3(points3D, true);
            const trackTube = new THREE.Mesh(
                new THREE.TubeGeometry(path, 64, 0.3, 8, true),
                new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.8 })
            );
            trackTube.userData = { key: 'maglev' };
            scene.add(trackTube);
            clickableObjects.push(trackTube);

            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const pillar = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.35, 0.45, 3.5, 16),
                    new THREE.MeshStandardMaterial({ color: 0x2e7d32 })
                );
                pillar.position.set(cx + Math.cos(angle) * 11, 1.75, cz + Math.sin(angle) * 11);
                scene.add(pillar);
            }

            const trainGroup = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, metalness: 0.8, roughness: 0.15 });
            const blueMat = new THREE.MeshStandardMaterial({ color: 0x0288d1, metalness: 0.5 });
            const windowMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.1 });

            const nose = new THREE.Mesh(new THREE.ConeGeometry(0.55, 1.6, 16), bodyMat);
            nose.rotation.z = -Math.PI / 2;
            nose.position.x = 2.4;
            trainGroup.add(nose);

            const car1 = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 3.2, 16), bodyMat);
            car1.rotation.z = Math.PI / 2;
            car1.position.x = 0.8;
            trainGroup.add(car1);

            const car2 = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 3.2, 16), bodyMat);
            car2.rotation.z = Math.PI / 2;
            car2.position.x = -2.6;
            trainGroup.add(car2);

            const stripe1 = new THREE.Mesh(new THREE.BoxGeometry(6.6, 0.15, 1.15), blueMat);
            stripe1.position.set(-0.8, 0, 0);
            trainGroup.add(stripe1);

            const winStrip = new THREE.Mesh(new THREE.BoxGeometry(5.8, 0.25, 1.12), windowMat);
            winStrip.position.set(-0.8, 0.18, 0);
            trainGroup.add(winStrip);

            trainGroup.position.set(cx + 11, 3.8, cz);
            trainGroup.userData = { key: 'maglev' };
            scene.add(trainGroup);
            trainMesh = trainGroup;
            clickableObjects.push(trainGroup);
        }

        function createEcoBuildingsWithSolar() {
            const solarMat = new THREE.MeshStandardMaterial({ color: 0x1d4ed8, metalness: 0.9, roughness: 0.1 });

            // Building 1
            const b1 = new THREE.Mesh(
                new THREE.BoxGeometry(5, 7, 4),
                new THREE.MeshStandardMaterial({ color: 0x4e342e })
            );
            b1.position.set(-7, 3.5, -7);
            scene.add(b1);

            const solar1 = new THREE.Mesh(new THREE.BoxGeometry(4.8, 0.2, 3.8), solarMat);
            solar1.position.set(-7, 7.1, -7);
            solar1.userData = { key: 'solar' };
            scene.add(solar1);
            clickableObjects.push(solar1);

            // Building 2
            const b2 = new THREE.Mesh(
                new THREE.BoxGeometry(5.5, 9, 4.5),
                new THREE.MeshStandardMaterial({ color: 0xfbc02d })
            );
            b2.position.set(0, 4.5, -8.5);
            scene.add(b2);

            const solar2 = new THREE.Mesh(new THREE.BoxGeometry(5.3, 0.2, 4.3), solarMat);
            solar2.position.set(0, 9.1, -8.5);
            solar2.userData = { key: 'solar' };
            scene.add(solar2);
            clickableObjects.push(solar2);
        }

        // Vertical Garden Wall Embedded with Colorful Miniature Flowers
        function createVerticalGardenWithFlowers() {
            const vgGroup = new THREE.Group();
            
            // Outer Frame
            const frame = new THREE.Mesh(
                new THREE.BoxGeometry(4.2, 5.2, 0.4),
                new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.5 })
            );
            frame.position.y = 2.6;
            vgGroup.add(frame);

            // Foliage Base
            const foliage = new THREE.Mesh(
                new THREE.BoxGeometry(3.9, 4.9, 0.45),
                new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.8 })
            );
            foliage.position.y = 2.6;
            vgGroup.add(foliage);

            // Miniature Flower Clusters inside planter slots
            const flowerColors = [0xef4444, 0xf59e0b, 0xec4899, 0x3b82f6, 0xa855f7, 0xfacc15];
            for (let r = 0; r < 6; r++) {
                for (let c = 0; c < 5; c++) {
                    const fx = -1.4 + c * 0.7;
                    const fy = 0.8 + r * 0.75;
                    const color = flowerColors[(r + c) % flowerColors.length];
                    const flMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3 });

                    // Flower bloom dot
                    const bloom = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), flMat);
                    bloom.position.set(fx + (Math.random() - 0.5) * 0.1, fy, 0.26);
                    vgGroup.add(bloom);

                    // Leaf petal accent
                    const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 6), new THREE.MeshStandardMaterial({ color: 0x22c55e }));
                    leaf.position.set(fx + 0.1, fy - 0.08, 0.25);
                    vgGroup.add(leaf);
                }
            }

            vgGroup.position.set(9.5, 0, -4);
            vgGroup.userData = { key: 'verticalgarden' };
            scene.add(vgGroup);
            clickableObjects.push(vgGroup);
        }

        // Landscape Green Trees (Pine Cone Trees & Leafy Canopy Trees)
        function createLandscapeTrees() {
            const treeGroupMaster = new THREE.Group();

            const createSingleTree = (x, z, scale = 1, type = 'canopy') => {
                const tGroup = new THREE.Group();
                const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5c3a21, roughness: 0.9 });
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18 * scale, 0.26 * scale, 1.8 * scale, 8), trunkMat);
                trunk.position.y = (0.9 * scale);
                tGroup.add(trunk);

                if (type === 'canopy') {
                    const leafMat = new THREE.MeshStandardMaterial({ color: 0x16a34a, roughness: 0.6 });
                    const top1 = new THREE.Mesh(new THREE.SphereGeometry(0.85 * scale, 8, 8), leafMat);
                    top1.position.y = (2.1 * scale);
                    tGroup.add(top1);

                    const top2 = new THREE.Mesh(new THREE.SphereGeometry(0.65 * scale, 8, 8), leafMat);
                    top2.position.set(0.2 * scale, 2.5 * scale, 0.1 * scale);
                    tGroup.add(top2);
                } else { // Pine Tree
                    const pineMat = new THREE.MeshStandardMaterial({ color: 0x14532d, roughness: 0.7 });
                    const c1 = new THREE.Mesh(new THREE.ConeGeometry(0.9 * scale, 1.5 * scale, 8), pineMat);
                    c1.position.y = (1.8 * scale);
                    tGroup.add(c1);

                    const c2 = new THREE.Mesh(new THREE.ConeGeometry(0.7 * scale, 1.3 * scale, 8), pineMat);
                    c2.position.y = (2.5 * scale);
                    tGroup.add(c2);
                }

                tGroup.position.set(x, 0, z);
                tGroup.userData = { key: 'trees' };
                treeGroupMaster.add(tGroup);
                clickableObjects.push(tGroup);
            };

            // Perimeter & Park Tree Coordinates
            const treeCoords = [
                { x: -13, z: -8, s: 1.1, t: 'canopy' },
                { x: -11, z: -10, s: 0.9, t: 'pine' },
                { x: -14, z: 2, s: 1.2, t: 'canopy' },
                { x: -12, z: 6, s: 1.0, t: 'pine' },
                { x: -10, z: 9, s: 1.1, t: 'canopy' },
                { x: -4, z: 10, s: 1.0, t: 'canopy' },
                { x: 4, z: 10, s: 0.95, t: 'pine' },
                { x: 11, z: 8, s: 1.15, t: 'canopy' },
                { x: 13, z: 2, s: 1.0, t: 'pine' },
                { x: 13, z: -8, s: 1.2, t: 'canopy' },
                { x: 6, z: -10, s: 0.9, t: 'pine' },
                { x: -5, z: 2, s: 0.8, t: 'canopy' },
                { x: 5, z: -1, s: 0.85, t: 'pine' }
            ];

            treeCoords.forEach(tc => createSingleTree(tc.x, tc.z, tc.s, tc.t));
            scene.add(treeGroupMaster);
        }

        function createWindmills() {
            const createTurbine = (x, z) => {
                const group = new THREE.Group();
                const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.2, 6, 16), new THREE.MeshStandardMaterial({ color: 0xffffff }));
                pole.position.y = 3;
                group.add(pole);

                const bladeGroup = new THREE.Group();
                bladeGroup.position.set(0, 6, 0.25);
                for (let i = 0; i < 3; i++) {
                    const blade = new THREE.Mesh(new THREE.BoxGeometry(0.2, 2.2, 0.05), new THREE.MeshStandardMaterial({ color: 0xffffff }));
                    blade.position.y = 1.1;
                    const pivot = new THREE.Group();
                    pivot.rotation.z = (i * Math.PI * 2) / 3;
                    pivot.add(blade);
                    bladeGroup.add(pivot);
                }
                group.add(bladeGroup);
                turbineBlades.push(bladeGroup);

                group.position.set(x, 0, z);
                group.userData = { key: 'wind' };
                scene.add(group);
                clickableObjects.push(group);
            };

            createTurbine(-11, -4);
            createTurbine(11, -6);
        }

        function createElectricBus() {
            const ebusGroup = new THREE.Group();
            
            const busBody = new THREE.Mesh(
                new THREE.BoxGeometry(2.8, 1.1, 1.2),
                new THREE.MeshStandardMaterial({ color: 0x16a34a, metalness: 0.3 })
            );
            busBody.position.y = 0.55;
            ebusGroup.add(busBody);

            const windshield = new THREE.Mesh(
                new THREE.BoxGeometry(0.1, 0.7, 1.1),
                new THREE.MeshStandardMaterial({ color: 0x0288d1, transparent: true, opacity: 0.7 })
            );
            windshield.position.set(1.4, 0.55, 0);
            ebusGroup.add(windshield);

            ebusGroup.position.set(7.5, 0.05, 2);
            ebusGroup.userData = { key: 'ebus' };
            scene.add(ebusGroup);
            eBusMesh = ebusGroup;
            clickableObjects.push(ebusGroup);
        }

        function createElectricSportsCars() {
            const createCar = (x, z, rotY, bodyColorHex) => {
                const carGroup = new THREE.Group();
                const bodyMat = new THREE.MeshStandardMaterial({ color: bodyColorHex, metalness: 0.7, roughness: 0.2 });
                const windowMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.1 });
                const wheelMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });

                const chassis = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.45, 1.1), bodyMat);
                chassis.position.y = 0.3;
                carGroup.add(chassis);

                const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.4, 0.95), bodyMat);
                cabin.position.set(-0.1, 0.65, 0);
                carGroup.add(cabin);

                const windshield = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.88), windowMat);
                windshield.position.set(0.35, 0.65, 0);
                carGroup.add(windshield);

                [{ wx: 0.6, wz: 0.55 }, { wx: 0.6, wz: -0.55 }, { wx: -0.6, wz: 0.55 }, { wx: -0.6, wz: -0.55 }].forEach(wp => {
                    const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.18, 16), wheelMat);
                    wheel.rotation.x = Math.PI / 2;
                    wheel.position.set(wp.wx, 0.22, wp.wz);
                    carGroup.add(wheel);
                });

                carGroup.position.set(x, 0.03, z);
                carGroup.rotation.y = rotY;
                carGroup.userData = { key: 'evcars' };
                scene.add(carGroup);
                clickableObjects.push(carGroup);
            };

            createCar(6, 8, -Math.PI / 6, 0xef4444);
            createCar(-6, -3, Math.PI / 2, 0x2563eb);
        }

        function createSmartInfrastructure() {
            // Streetlights
            const lightPoleMat = new THREE.MeshStandardMaterial({ color: 0x64748b });
            const lampMat = new THREE.MeshStandardMaterial({ color: 0xfef08a, emissive: 0xfef08a, emissiveIntensity: 0.6 });

            [
                { x: 0, z: 9.5 },
                { x: 0, z: -5.5 },
                { x: -7.5, z: 2 },
                { x: 7.5, z: 2 }
            ].forEach(p => {
                const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 2.5), lightPoleMat);
                pole.position.set(p.x, 1.25, p.z);
                const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), lampMat);
                lamp.position.set(p.x, 2.5, p.z);
                scene.add(pole);
                scene.add(lamp);
            });
        }

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function onCanvasClick(event) {
            startIntroSpeech();

            if (event.target.closest('header') || event.target.closest('.absolute')) return;

            const container = document.getElementById('webgl-canvas');
            const rect = container.getBoundingClientRect();

            mouse.x = ((event.clientX - rect.left) / container.clientWidth) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / container.clientHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(clickableObjects, true);

            if (intersects.length > 0) {
                let obj = intersects[0].object;
                let key = null;
                while (obj && !key && obj !== scene) {
                    if (obj.userData && obj.userData.key) key = obj.userData.key;
                    obj = obj.parent;
                }
                if (key && hotspotData[key]) selectHotspot(key);
            }
        }

        function selectHotspot(key) {
            startIntroSpeech();

            const data = hotspotData[key];
            if (!data) return;

            document.getElementById('inspectBadge').innerText = data.badge;
            document.getElementById('inspectTitle').innerText = data.title;
            document.getElementById('inspectDesc').innerText = data.desc;

            const card = document.getElementById('inspectorCard');
            card.classList.add('pulse-glow');
            setTimeout(() => card.classList.remove('pulse-glow'), 1200);

            speakText(data.speech);
        }

        function resetInspectView() {
            document.getElementById('inspectBadge').innerText = "Select Element";
            document.getElementById('inspectTitle').innerText = "Tap any object in 3D scene";
            document.getElementById('inspectDesc').innerText = "Project team: Nour, Avyukth, Brahmani, and Syed Affan. Tap any model element or use the buttons above to hear descriptions.";
            controls.target.set(0, 0, 0);
            camera.position.set(0, 24, 34);
            if (synth && synth.speaking) synth.cancel();
        }

        function toggleDayNight() {
            dayNightState = !dayNightState;
            const btnIcon = document.getElementById('dayNightIcon');
            if (dayNightState) {
                scene.background = new THREE.Color(0x0e1726);
                ambientLight.intensity = 0.8;
                dirLight.intensity = 1.25;
                btnIcon.className = "fa-solid fa-sun";
            } else {
                scene.background = new THREE.Color(0x050811);
                ambientLight.intensity = 0.3;
                dirLight.intensity = 0.35;
                btnIcon.className = "fa-solid fa-moon text-indigo-300";
            }
        }

        let isAudioPlaying = false;
        function toggleAudioSpeech() {
            if (!synth) return;
            if (isAudioPlaying) {
                synth.cancel();
                isAudioPlaying = false;
                document.getElementById('audioIcon').className = "fa-solid fa-volume-high";
            } else {
                speakText("Welcome to Satat Pur, a smart and sustainable Indian city created by Class 1 A students Nour, Avyukth, Brahmani, and Syed Affan.");
                isAudioPlaying = true;
                document.getElementById('audioIcon').className = "fa-solid fa-volume-xmark";
            }
        }

        function onWindowResize() {
            const container = document.getElementById('webgl-canvas');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        let clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const elapsedTime = clock.getElapsedTime();

            // Rotate Maglev Train
            if (trainMesh) {
                const angle = elapsedTime * 0.42;
                trainMesh.position.x = Math.cos(angle) * 11;
                trainMesh.position.z = 2 + Math.sin(angle) * 11;
                trainMesh.rotation.y = -angle;
            }

            // Move Electric Bus along road loop
            if (eBusMesh) {
                const busAngle = -elapsedTime * 0.3 + Math.PI;
                const busRadius = 7.5;
                eBusMesh.position.x = Math.cos(busAngle) * busRadius;
                eBusMesh.position.z = 2 + Math.sin(busAngle) * busRadius;
                eBusMesh.rotation.y = -busAngle - Math.PI / 2;
            }

            // Spin Windmill Blades
            turbineBlades.forEach(blade => {
                blade.rotation.z -= delta * 2.5;
            });

            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = initScene;
    </script>
</body>
</html>
